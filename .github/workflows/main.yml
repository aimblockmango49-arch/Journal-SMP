
name: Build Journal SMP Mod

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        working-directory: Journal-SMP-Build-Ready/Journal-SMP-Minecraft-Mod
        run: chmod +x gradlew && ./gradlew --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: journalsmp-fabric-1.21.11
          path: Journal-SMP-Build-Ready/Journal-SMP-Minecraft-Mod/build/libs/*.jar
          if-no-files-found: error
